server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discovers ALL containers on this Docker host via the daemon socket -
  # independent of which network a container is on, so it does not require
  # touching any other repo's compose file to collect its logs.
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Only ship logs for containers that belong to this migration lab -
      # keeps Loki from filling up with unrelated local projects.
      - source_labels: [compose_project]
        regex: "(monolito-microservice|user-service|sales-service|cdc-infrastructure|observability-infrastructure|migration-tool|api-gateway)"
        action: keep
    pipeline_stages:
      # Kong access lines (file-log plugin) are JSON too: route, upstream,
      # method, path, status, request_id, trace_id, latencies.* are all
      # queryable with `| json` - deliberately NOT promoted to labels
      # (request_id / trace_id / path would explode Loki's index).
      # App containers already log JSON to stdout - parse it so fields like
      # level, request_id, topic, partition, operation become queryable
      # Loki labels/fields without ever turning entity_id/user_id into an
      # indexed label (kept as a JSON field only, searched via LogQL `|=`/`| json`).
      - json:
          expressions:
            level: level
            timestamp: timestamp
            logger: logger
            request_id: request_id
            trace_id: trace_id
            span_id: span_id
            event: event
            topic: topic
            partition: partition
            operation: op
      - labels:
          level:
          logger:
